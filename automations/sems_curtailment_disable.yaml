################################################################################
# SEMS Curtailment Disable
################################################################################
#
#   Restores inverter to 100% when Automatic Curtailment is turned OFF.
#   Runs independently of sems_curtailment.yaml to avoid condition
#   blocking. Does not fire on manual toggles of Curtailment Active - see
#   sems_curtailment_manual.yaml for that.
#
################################################################################

- id: sems_curtailment_disable
  alias: SEMS Curtailment Disable
  trace:
    stored_traces: 10
  description: >
    Restores inverter to 100% output when Automatic Curtailment is turned
    off.
  trigger:
    - platform: state
      entity_id: switch.sems_curtailment_automatic_curtailment
      to: "off"
  condition: []
  action:
    - action: sems_curtailment.set_power_limit
      data:
        limit: 100
      response_variable: cmd_result
    - if:
        - condition: template
          value_template: "{{ not cmd_result.success }}"
      then:
        # Worth shouting about: this path exists specifically to un-curtail
        # the inverter, so a silent failure leaves solar capped with the
        # automation switched off and nothing left to retry it.
        - service: notify.notification
          data:
            title: "SEMS Curtailment Disable Failed"
            message: >
              Failed to restore inverter to 100% after Automatic Curtailment
              was turned off. {{ cmd_result.message }}
    - service: number.set_value
      target:
        entity_id: number.sems_curtailment_current_power_limit
      data:
        value: 100
    - service: switch.turn_off
      target:
        entity_id: switch.sems_curtailment_curtailment_active
