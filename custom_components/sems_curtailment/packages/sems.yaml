################################################################################
# Home Assistant GoodWe SEMS Curtailment - HA Package
################################################################################
#
# This file is automatically loaded by Home Assistant when you have:
#
#   homeassistant:
#     packages: !include_dir_named packages/
#
# in your configuration.yaml (added by install.sh - see the baseline Amber
# integration's install.sh for where this line first gets added, if you
# installed that project first).
#
# All the switches and sizing values this project used to keep here as
# input_boolean / input_number helpers now live on the integration's own
# device page instead: Settings → Devices & Services → GoodWe SEMS
# Curtailment. This package only declares one shell_command left over from
# that - the one that re-runs install.sh automatically after a HACS update.
#
# Controlling the inverter itself is a Home Assistant service
# (sems_curtailment.set_power_limit) registered by the integration, not a
# shell_command - see automations/sems_curtailment.yaml.
################################################################################

shell_command:
  # Runs the install script to copy integration files after a HACS update
  # Called automatically by sems_hacs_auto_install automation
  sems_hacs_install: "bash /config/custom_components/sems_curtailment/install.sh {{ mode | default('full') }}"
