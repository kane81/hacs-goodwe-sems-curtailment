# Service descriptions for the Developer Tools -> Actions UI.
# The service itself is registered in __init__.py (_async_register_services).
set_power_limit:
  name: Set power limit
  description: >
    Set the GoodWe inverter's active power output limit via the SEMS Portal.
    This is the same call the curtailment automations make. Returns
    {success, message} when called with a response.
  fields:
    limit:
      name: Limit
      description: Output limit as a percentage of rated capacity, 0-100.
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
