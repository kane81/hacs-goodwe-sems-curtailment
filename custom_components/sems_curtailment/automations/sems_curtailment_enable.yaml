################################################################################
# SEMS Curtailment Enable
################################################################################
#
#   Immediately triggers curtailment recalculation when Automatic
#   Curtailment is turned ON. Without this, curtailment waits for the next
#   Amber poll or the 5 minute safety timer.
#
################################################################################

- id: sems_curtailment_enable
  alias: SEMS Curtailment Enable
  trace:
    stored_traces: 10
  description: >
    Immediately recalculates and applies curtailment when Automatic
    Curtailment is turned ON, without waiting for the next Amber poll.
  trigger:
    - platform: state
      entity_id: switch.sems_curtailment_automatic_curtailment
      to: "on"
  condition:
    - condition: template
      value_template: "{{ states('sensor.amber_smart_shift_sell_price') not in ['unknown', 'unavailable'] }}"
  action:
    - service: automation.trigger
      target:
        entity_id: automation.sems_solar_curtailment_based_on_amber_price
      data:
        skip_condition: false
