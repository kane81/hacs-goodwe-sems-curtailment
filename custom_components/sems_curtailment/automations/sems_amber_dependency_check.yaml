################################################################################
# SEMS Amber Dependency Check
################################################################################
#
#   Checks on HA startup that the baseline Amber integration is installed
#   and actively polling prices. If Amber prices are stale or unavailable
#   the SEMS curtailment automations cannot function correctly.
#
#   v2.0 also checks that the Power sensor text helpers have been configured
#   in the baseline Amber integration, since SEMS Curtailment v2.0 no longer
#   ships its own battery/solar/load/grid sensor pointers and relies
#   entirely on those being set.
#
# How it works:
#   HA starts
#       ↓
#   Wait 2 minutes for all integrations to initialise
#       ↓
#   Check sensor.amber_smart_shift_buy_price and last_price_poll are available
#       ↓ Missing/unavailable → send notification warning user
#   Check the battery and load Power sensor text helpers are configured
#       ↓ Blank → send notification prompting user to configure them
#       ↓ Present → do nothing
#
#-------------------------------------------------------------------------------
# Change Log
#-------------------------------------------------------------------------------
#   v1.0    2026-04-08    Kane Li    - Initial version
#   v2.0    2026-08-04    Kane Li    - Switched to baseline Amber integration's
#                                      native sensor.amber_smart_shift_* entities.
#                                      Added a check + prompt for the Power
#                                      sensor text helpers, since v2.0 no longer
#                                      ships its own sensor pointers.
################################################################################

- id: sems_amber_dependency_check
  alias: SEMS Amber Dependency Check
  description: >
    Checks on startup that the baseline Amber integration is installed and
    providing price data, and that the Power sensor text helpers it exposes
    have been configured. Notifies if either dependency is missing.
  trigger:
    - platform: homeassistant
      event: start
  action:
    # Wait for integrations to initialise before checking
    - delay: "00:02:00"
    - variables:
        price_state: "{{ states('sensor.amber_smart_shift_buy_price') }}"
        polled_state: "{{ states('sensor.amber_smart_shift_last_price_poll') }}"
        battery_sensor: "{{ states('text.amber_smart_shift_power_battery_sensor') }}"
        load_sensor: "{{ states('text.amber_smart_shift_power_load_sensor') }}"
    - if:
        - condition: template
          value_template: "{{ price_state in ['unknown', 'unavailable'] or polled_state in ['unknown', 'unavailable'] }}"
      then:
        - service: persistent_notification.create
          data:
            title: "⚠️ SEMS Curtailment — Missing Dependency"
            notification_id: sems_amber_dependency
            message: >
              The baseline Amber integration does not appear to be installed
              or is not yet providing price data.
              SEMS curtailment automations require Amber Electric prices to function.
              Please install/configure the baseline Amber integration first.
    - if:
        - condition: template
          value_template: >
            {{ battery_sensor in ['', 'unknown', 'unavailable', none]
               or load_sensor in ['', 'unknown', 'unavailable', none] }}
      then:
        - service: persistent_notification.create
          data:
            title: "⚠️ SEMS Curtailment — Power Sensors Not Configured"
            notification_id: sems_power_sensors_missing
            message: >
              SEMS Curtailment v2.0 reads your battery and load readings from
              the baseline Amber integration's Power sensor text helpers
              (text.amber_smart_shift_power_battery_sensor and
              text.amber_smart_shift_power_load_sensor), rather than shipping
              its own. These are currently blank.
              Go to Settings → Devices & Services → Entities, search for
              "Power:", and set them to your own battery/load/solar/grid
              sensor entity IDs — otherwise curtailment calculations will
              treat load and battery as 0W.
